# Entity-id'er bekræftet i brugerens HA-liste 27. oktober 2026.
type: custom:pond-flow-card
title: Dammen
demo: false
entities:
  temp_bottom: sensor.garden_pond_controller_dam_temperatur_bund
  temp_surface: sensor.garden_pond_controller_dam_temperatur_overflade
  water_level: sensor.garden_pond_controller_vandstand
  status: sensor.garden_pond_controller_dam_status
  last_event: sensor.garden_pond_controller_seneste_haendelse
  pump_running: binary_sensor.garden_pond_controller_filterpumpe_koerer
  uv_running: binary_sensor.garden_pond_controller_uv_c_taendt
  pump_mode: select.garden_pond_controller_filterpumpe_tilstand
  uv_mode: select.garden_pond_controller_uv_c_tilstand
  aerator_mode: select.garden_pond_controller_luftpumpe_tilstand
  aerator_running: binary_sensor.garden_pond_controller_luftpumpe_koerer
  skimmer_running: binary_sensor.garden_pond_controller_skimmer_koerer
  skimmer_mode: select.garden_pond_controller_skimmer_tilstand
  skimmer_plan: select.garden_pond_controller_skimmer_plan
  pump_hours: sensor.garden_pond_controller_filterpumpe_drift_total
  uv_hours: sensor.garden_pond_controller_uv_c_drift_total
  aerator_hours: sensor.garden_pond_controller_luftpumpe_drift_total
  skimmer_hours: sensor.garden_pond_controller_skimmer_drift_total
# Isfriholderen tilkobles først, når den har sin egen styringsentitet.
